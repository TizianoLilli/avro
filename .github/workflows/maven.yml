name: Apache Avro CI

on:
  push:
    branches:
      - main
      - master
      - customTests

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build with Maven
        run: mvn -B clean compile test-compile

      - name: Run custom tests
        run: mvn -B -Dtest="customTests.**.*" test

      - name: Message
        run: echo "Build remote project on every push"
