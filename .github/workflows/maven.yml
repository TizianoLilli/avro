name: Apache Avro CI

on:
  push:
    branches:
      - main
      - master
      - customTests

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build with Maven
        run: mvn -B clean verify -DskipTests

      - name: Run custom tests
        run: mvn -B -Dtest=customTests.manual.ParseContextUnitTest test
             #mvn -B -Dtest="customTests.**.*" test
